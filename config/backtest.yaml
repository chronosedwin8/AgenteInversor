# Backtest y walk-forward (Fase 2). Decidido ANTES de ver resultados; no se ajusta mirando
# los periodos de validación. Comisión y deslizamiento: strategy.yaml (costs).

walk_forward:
  warmup_months: 1        # calentamiento de indicadores (EMA200 de 1 h), sin operar
  train_months: 6         # periodo donde se eligen parámetros
  test_months: 3          # periodo fuera de muestra con los parámetros elegidos
  min_train_trades: 15    # combinaciones con menos operaciones en entrenamiento no se eligen

# Rejilla pequeña (64 combinaciones) que incluye los valores del plan. Nombres = campos de
# RuleParams; enforce_entry_window activa la ventana 07:00–18:00 Bogotá para nuevas entradas.
grid:
  adx_min: [20, 25]
  stop_atr_multiple: [1.5, 2.0]
  partial_take_r: [1.5, 2.0]
  trailing_atr_multiple: [2.0, 3.0]
  volume_multiplier: [1.0, 1.2]
  enforce_entry_window: [true, false]

# Criterios para seguir (PLAN.md, Fase 2), medidos sobre el tramo fuera de muestra.
acceptance:
  min_trades: 100
  min_profit_factor: 1.3
  max_drawdown_pct: 8
  last_months_positive: 3
