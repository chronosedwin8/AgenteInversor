# Límites de riesgo (PLAN.md, sección "Gestión de riesgo").
# Este archivo se carga UNA vez al arrancar como modelo inmutable: cambiar un límite exige reiniciar.
# Lo aplica el RiskManager (Fase 3), que es la autoridad final.

initial_capital_usdt: 200

risk_per_trade_pct: 0.5            # ≈ 1,00 USD con 200
max_position_pct: 40               # ≈ 80 USD
max_total_exposure_pct: 80         # suma de posiciones abiertas + órdenes pendientes
min_position_notional_multiple: 2  # tamaño mínimo = 2 × NOTIONAL del par + margen
min_position_margin_pct: 10        # margen sobre ese mínimo
max_open_positions: 2
max_open_positions_bstocks: 1
max_new_trades_per_day: 4
daily_loss_limit_pct: 2            # sin entradas hasta 00:00 hora Bogotá
max_consecutive_losses: 3
consecutive_losses_pause_hours: 24

drawdown_alert_pct: 6              # capital ≤ 188 → riesgo baja a reduced_risk_per_trade_pct
reduced_risk_per_trade_pct: 0.25

# Kill switch: −10% desde el MÁXIMO alcanzado por el capital (decisión de Edwin, 2026-10-30).
# Con 200 USD sin ganancias previas sigue siendo 180 USD; si el capital sube a 250, salta en 225.
# Tras un reinicio manual, el máximo de referencia pasa a ser el capital de ese momento.
kill_switch_pct: 10
kill_switch_basis: peak

leverage: none
fee_rate: 0.001                    # 0,1% por lado (0,00075 con BNB)
