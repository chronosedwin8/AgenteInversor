name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: trading_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bot -d trading_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://bot:ci-only@localhost:5432/trading_bot_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: sh scripts/ci.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build bot
      # Criterio de la Fase 0: el bot arranca en modo paper sin claves.
      - run: sh scripts/smoke.sh
